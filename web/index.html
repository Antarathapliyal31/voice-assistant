<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Voice Assistant — Phase 3 (naive pipeline)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; max-width: 46rem; }
    h1   { font-size: 1.3rem; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; margin-right: 0.5rem; }

    #status { font-size: 1.6rem; font-weight: 600; margin: 1rem 0;
              padding: 0.9rem 1rem; border-radius: 8px; background: #eef;
              border: 1px solid #dde; }
    #status.listening { background: #eef; border-color: #ccd; }
    #status.speaking  { background: #fde; border-color: #e9b; }
    #status.thinking  { background: #ffe; border-color: #ec9; }
    #status.talking   { background: #e8f3ff; border-color: #9bd; }
    #status.ended     { background: #efe; border-color: #beb; }

    #log { background: #f4f4f4; padding: 0.8rem; border-radius: 6px;
           height: 20rem; overflow-y: auto;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
           font-size: 0.82rem; white-space: pre-wrap; }
    .warn { color: #a60; }
    .err  { color: #c00; }
    .ok   { color: #060; }
    .you  { color: #04a; font-weight: 600; }
    .toy  { color: #850; font-weight: 600; }

    #latency { margin-top: 1rem; }
    #latency table { border-collapse: collapse; font-size: 0.9rem; }
    #latency td { padding: 0.15rem 0.6rem; }
    #latency td:first-child { color: #666; }
    #latency td:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; }
    #latency .ttfa { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Voice Assistant — Phase 3 (naive pipeline)</h1>
  <p>Click <b>Start</b>, ask a question, then wait. The server runs STT → LLM → TTS
     strictly sequentially and sends back the MP3 of the reply. Latency breakdown
     appears below each turn.</p>

  <div>
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <!-- Big live status line. -->
  <div id="status">ready</div>

  <h3>Latency (last turn)</h3>
  <div id="latency"><em>no turn yet</em></div>

  <h3>Log</h3>
  <div id="log"></div>

<script>
"use strict";

// -----------------------------------------------------------------------------
// Module-scope state. Lives across Start/Stop clicks so stop() can tear down.
// -----------------------------------------------------------------------------
let micContext      = null;  // AudioContext for the mic (16 kHz)
let playbackContext = null;  // SEPARATE AudioContext for TTS playback (default rate)
let mediaStream     = null;  // the raw mic stream from getUserMedia
let workletNode     = null;  // AudioWorkletNode wrapping mic-worklet.js
let ws              = null;  // WebSocket to the Python server

const startBtn  = document.getElementById("start");
const stopBtn   = document.getElementById("stop");
const logEl     = document.getElementById("log");
const statusEl  = document.getElementById("status");
const latencyEl = document.getElementById("latency");

// -----------------------------------------------------------------------------
// Tiny helpers.
// -----------------------------------------------------------------------------
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function sendControl(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function renderLatency(msg) {
  // msg has stt_ms, llm_ttft_ms, llm_total_ms, tts_ms, time_to_first_audio_ms.
  // Build a tiny two-column table so the ms numbers line up.
  const rows = [
    ["STT",              msg.stt_ms],
    ["LLM first token",  msg.llm_ttft_ms],
    ["LLM full answer",  msg.llm_total_ms],
    ["TTS",              msg.tts_ms],
  ];
  const html = ["<table>"];
  for (const [name, ms] of rows) {
    html.push(`<tr><td>${name}</td><td>${ms.toFixed(0)} ms</td></tr>`);
  }
  html.push(
    `<tr class="ttfa"><td>Time to first audio</td>` +
    `<td>${msg.time_to_first_audio_ms.toFixed(0)} ms</td></tr>`
  );
  html.push("</table>");
  latencyEl.innerHTML = html.join("");
}

// -----------------------------------------------------------------------------
// start(): mic + worklet + two AudioContexts + WebSocket.
// -----------------------------------------------------------------------------
async function start() {
  startBtn.disabled = true;

  try {
    // 1) Mic access with the three "cleanup" hints Chrome supports.
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
    log("mic granted", "ok");

    // 2) Mic AudioContext — pinned to 16 kHz so the browser resamples for us.
    micContext = new AudioContext({ sampleRate: 16000 });
    log(`mic AudioContext sampleRate = ${micContext.sampleRate}`);
    if (micContext.sampleRate !== 16000) {
      log(`WARNING: expected 16000 Hz, got ${micContext.sampleRate}.`, "warn");
    }

    // 3) SEPARATE playback AudioContext at the system default rate (typically
    //    48 kHz on macOS). We can't reuse the mic context for TTS playback
    //    because its 16 kHz rate would downsample the MP3 to telephone
    //    quality. We create it INSIDE this click handler so Chrome's autoplay
    //    rule accepts it as a user gesture — no "AudioContext was not allowed
    //    to start" warning later.
    playbackContext = new AudioContext();
    log(`playback AudioContext sampleRate = ${playbackContext.sampleRate}, ` +
        `state = ${playbackContext.state}`);
    if (playbackContext.state === "suspended") {
      // Belt-and-braces: resume() so the context is live even if Chrome
      // defaulted it to suspended.
      await playbackContext.resume();
      log(`playback AudioContext resumed, state = ${playbackContext.state}`);
    }

    // 4) Load the worklet, hook up mic -> worklet. No connection to
    //    destination — we don't want to hear ourselves.
    await micContext.audioWorklet.addModule("mic-worklet.js");
    const source = micContext.createMediaStreamSource(mediaStream);
    workletNode = new AudioWorkletNode(micContext, "mic-chunker");
    source.connect(workletNode);

    // 5) WebSocket. Set binaryType BEFORE onmessage so MP3 payloads
    //    arrive as ArrayBuffer, not Blob.
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      log("WebSocket open — sending start", "ok");
      ws.send(JSON.stringify({ type: "start", sample_rate: 16000 }));
      setStatus("🎧 listening...", "listening");

      // Only forward audio once the socket is open.
      workletNode.port.onmessage = (event) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(event.data);
        }
      };
      stopBtn.disabled = false;
    };

    ws.onmessage = handleServerMessage;
    ws.onerror = () => log("WebSocket error", "err");
    ws.onclose = (e) => log(`WebSocket closed (code ${e.code})`);

  } catch (err) {
    log(`start failed: ${err.message}`, "err");
    await cleanup();
    startBtn.disabled = false;
  }
}

// -----------------------------------------------------------------------------
// handleServerMessage(): one place for both JSON and binary frames.
// -----------------------------------------------------------------------------
async function handleServerMessage(event) {
  // Binary = MP3 from TTS. Decode and play, then tell the server when
  // playback starts and ends so it can compute "time to first audio" and
  // free the busy latch.
  if (typeof event.data !== "string") {
    const mp3 = event.data;              // ArrayBuffer
    log(`server: <mp3 ${mp3.byteLength} bytes>`);
    try {
      await playMp3(mp3);
    } catch (err) {
      log(`playback failed: ${err.message}`, "err");
    }
    return;
  }

  // Text = JSON. Log the raw line and then route by type.
  log(`server: ${event.data}`);
  let msg;
  try { msg = JSON.parse(event.data); } catch { return; }

  switch (msg.type) {
    case "vad":
      if (msg.event === "speech_start") {
        setStatus("🎤 speaking...", "speaking");
      } else if (msg.event === "turn_end") {
        // The pipeline is now working on this turn. Jump straight to
        // "thinking" — no end-of-turn flash to compete with it.
        setStatus("💭 thinking...", "thinking");
      }
      break;

    case "transcript":
      log(`You: ${msg.text}  (lang=${msg.language})`, "you");
      break;

    case "answer":
      log(`Toy: ${msg.text}`, "toy");
      break;

    case "latency":
      renderLatency(msg);
      break;

    case "error":
      log(`server error [${msg.stage}]: ${msg.message}`, "err");
      // Server has cleared busy; fall back to listening so the next turn
      // can start.
      setStatus("🎧 listening...", "listening");
      break;

    case "summary":
      setStatus(
        `done — ${msg.turns} turn(s), ${msg.duration_s.toFixed(1)}s total`,
        ""
      );
      break;
  }
}

// -----------------------------------------------------------------------------
// playMp3(): decode on the playback context, then start().
//
// decodeAudioData DETACHES the input ArrayBuffer, so we can't reuse it after.
// That's fine; we don't need the raw bytes once the AudioBuffer exists.
// -----------------------------------------------------------------------------
async function playMp3(arrayBuffer) {
  if (!playbackContext) throw new Error("no playback context");
  const audioBuffer = await playbackContext.decodeAudioData(arrayBuffer);

  const srcNode = playbackContext.createBufferSource();
  srcNode.buffer = audioBuffer;
  srcNode.connect(playbackContext.destination);

  // Fire-and-forget: when the source finishes, tell the server.
  srcNode.onended = () => {
    sendControl({ type: "playback_ended" });
    log("playback ended");
    setStatus("🎧 listening...", "listening");
  };

  // Start playback FIRST, then immediately tell the server. The server
  // takes this as "time to first audio" on the client clock.
  srcNode.start();
  sendControl({ type: "playback_started" });
  setStatus("🔊 talking...", "talking");
}

// -----------------------------------------------------------------------------
// stop() + cleanup()
// -----------------------------------------------------------------------------
async function stop() {
  stopBtn.disabled = true;
  try {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "stop" }));
    }
  } catch (err) {
    log(`stop send failed: ${err.message}`, "err");
  }
  await cleanup();
  startBtn.disabled = false;
}

async function cleanup() {
  if (workletNode) {
    try { workletNode.port.onmessage = null; workletNode.disconnect(); } catch {}
    workletNode = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach((t) => t.stop());
    mediaStream = null;
  }
  if (micContext) {
    try { await micContext.close(); } catch {}
    micContext = null;
  }
  if (playbackContext) {
    try { await playbackContext.close(); } catch {}
    playbackContext = null;
  }
  if (ws) {
    const closing = ws;
    ws = null;
    setTimeout(() => {
      // Code 1000 = normal closure; explicit so the server log is unambiguous.
      if (closing.readyState === WebSocket.OPEN) closing.close(1000, "stop");
    }, 1000);
  }
}

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
</script>
</body>
</html>
